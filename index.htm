<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiko - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="h-full font-sans antialiased bg-black text-slate-100 flex items-center justify-center p-4 sm:p-6 overflow-x-hidden selection:bg-yellow-400 selection:text-black">

    <!-- ========================================= -->
    <!-- MÚSICA DE FUNDO                           -->
    <!-- ========================================= -->

    <audio id="background-music" preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        const music = document.getElementById("background-music");

        // Volume da música
        music.volume = 0.35;

        // Trecho que será reproduzido
        const MUSIC_START = 10;
        const MUSIC_END = 25;

        function startMusic() {
            if (music.paused) {
                music.currentTime = MUSIC_START;

                music.play().catch(function(error) {
                    console.log("O navegador bloqueou o áudio:", error);
                });
            }
        }

        // Tenta iniciar automaticamente
        window.addEventListener("load", function () {
            music.currentTime = MUSIC_START;

            music.play().catch(function () {
                console.log("Autoplay bloqueado. Clique na página para iniciar.");
            });
        });

        // Se o navegador bloquear o autoplay,
        // o primeiro clique/toque inicia a música.
        document.addEventListener("click", startMusic, { once: true });
        document.addEventListener("touchstart", startMusic, { once: true });

        // Para no segundo definido e volta para o início do trecho.
        music.addEventListener("timeupdate", function () {
            if (music.currentTime >= MUSIC_END) {
                music.pause();
                music.currentTime = MUSIC_START;
            }
        });
    </script>


    <!-- ========================================= -->
    <!-- EFEITOS DE FUNDO                          -->
    <!-- ========================================= -->

    <div class="absolute top-10 left-10 w-72 h-72 bg-purple-500 rounded-full
                mix-blend-multiply filter blur-3xl opacity-30
                animate-pulse-slow pointer-events-none"></div>

    <div class="absolute bottom-10 right-10 w-96 h-96 bg-pink-500 rounded-full
                mix-blend-multiply filter blur-3xl opacity-30
                animate-pulse-slow pointer-events-none"
         style="animation-delay: 2s;"></div>


    <!-- ========================================= -->
    <!-- LOGIN                                     -->
    <!-- ========================================= -->

    <div id="auth-container"
         class="relative w-full max-w-md bg-white/10 backdrop-blur-xl
                border border-white/20 rounded-3xl shadow-2xl
                p-6 sm:p-8 transition-all duration-500 z-10">

        <!-- Logo -->
        <div class="text-center mb-6">

            <div class="inline-flex items-center justify-center
                        w-14 h-14 rounded-2xl bg-yellow-400
                        text-black shadow-lg mb-3 animate-float">

                <i class="fa-solid fa-bolt-lightning text-2xl"></i>

            </div>

            <h1 id="form-title"
                class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
                Bem Vindo ao Kiko
            </h1>

            <p id="form-subtitle"
               class="text-sm text-purple-200 mt-1">
                Por favor, insira seus dados para entrar.
            </p>

        </div>


        <!-- Tabs -->
        <div class="grid grid-cols-2 p-1 bg-black/20 rounded-2xl mb-6 relative">

            <div id="tab-indicator"
                 class="absolute top-1 bottom-1 w-[calc(50%-4px)]
                        bg-white/20 backdrop-blur-md rounded-xl
                        transition-all duration-300 shadow-sm">
            </div>

            <button
                onclick="switchTab('login')"
                id="btn-tab-login"
                class="relative z-10 py-2.5 text-sm font-semibold text-white transition-colors">
                Entrar
            </button>

            <button
                onclick="switchTab('register')"
                id="btn-tab-register"
                class="relative z-10 py-2.5 text-sm font-semibold
                       text-purple-300 hover:text-white transition-colors">
                Registrar
            </button>

        </div>


        <!-- ========================================= -->
        <!-- FORMULÁRIO                                -->
        <!-- ========================================= -->

        <form id="auth-form"
              onsubmit="handleSubmit(event)"
              class="space-y-4"
              novalidate>


            <!-- Nome -->
            <div id="name-field-container"
                 class="space-y-1 hidden opacity-0 transition-opacity duration-300">

                <label class="block text-xs font-semibold uppercase
                              tracking-wider text-purple-200">
                    Nome completo
                </label>

                <div class="relative">

                    <span class="absolute inset-y-0 left-0 pl-3.5
                                 flex items-center pointer-events-none
                                 text-purple-300">

                        <i class="fa-regular fa-user"></i>

                    </span>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="João Silva"
                        class="w-full pl-10 pr-4 py-3 bg-white/5
                               border border-white/10 rounded-xl
                               text-white placeholder-purple-300/50
                               text-sm focus:outline-none
                               focus:ring-2 focus:ring-yellow-400
                               focus:border-transparent transition-all">

                </div>

                <p id="name-error"
                   class="text-xs text-pink-400 hidden"></p>

            </div>


            <!-- Email -->
            <div class="space-y-1">

                <label class="block text-xs font-semibold uppercase
                              tracking-wider text-purple-200">
                    E-mail
                </label>

                <div class="relative">

                    <span class="absolute inset-y-0 left-0 pl-3.5
                                 flex items-center pointer-events-none
                                 text-purple-300">

                        <i class="fa-regular fa-envelope"></i>

                    </span>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="nome@exemplo.com"
                        class="w-full pl-10 pr-4 py-3 bg-white/5
                               border border-white/10 rounded-xl
                               text-white placeholder-purple-300/50
                               text-sm focus:outline-none
                               focus:ring-2 focus:ring-yellow-400
                               focus:border-transparent transition-all">

                </div>

                <p id="email-error"
                   class="text-xs text-pink-400 hidden"></p>

            </div>


            <!-- Senha -->
            <div class="space-y-1">

                <label class="block text-xs font-semibold uppercase
                              tracking-wider text-purple-200">
                    Senha
                </label>

                <div class="relative">

                    <span class="absolute inset-y-0 left-0 pl-3.5
                                 flex items-center pointer-events-none
                                 text-purple-300">

                        <i class="fa-solid fa-lock"></i>

                    </span>

                    <input
                        type="password"
                        id="password"
                        required
                        placeholder="••••••••"
                        oninput="checkPasswordStrength(this.value)"
                        class="w-full pl-10 pr-12 py-3 bg-white/5
                               border border-white/10 rounded-xl
                               text-white placeholder-purple-300/50
                               text-sm focus:outline-none
                               focus:ring-2 focus:ring-yellow-400
                               focus:border-transparent transition-all">

                    <button
                        type="button"
                        onclick="togglePasswordVisibility()"
                        class="absolute inset-y-0 right-0 pr-3.5
                               flex items-center text-purple-300
                               hover:text-white transition-colors">

                        <i id="toggle-icon"
                           class="fa-regular fa-eye"></i>

                    </button>

                </div>

                <p id="password-error"
                   class="text-xs text-pink-400 hidden"></p>

            </div>


            <!-- Lembrar -->
            <div id="extra-options"
                 class="flex items-center justify-between text-sm py-1">

                <label class="flex items-center gap-2 cursor-pointer select-none">

                    <input
                        type="checkbox"
                        id="remember-me"
                        class="w-4 h-4 rounded border-white/20
                               bg-white/5 text-yellow-500
                               focus:ring-yellow-500
                               focus:ring-offset-0 cursor-pointer">

                    <span class="text-purple-200 text-xs">
                        Lembrar de mim
                    </span>

                </label>

                <a href="#"
                   onclick="showForgotPassword(event)"
                   class="text-xs text-yellow-300 hover:text-white
                          transition-colors font-medium">

                    Esqueci a senha

                </a>

            </div>


            <!-- ========================================= -->
            <!-- BOTÃO ENTRAR AMARELO GRADIENTE             -->
            <!-- ========================================= -->

            <button
                type="submit"
                id="submit-btn"
                class="w-full py-3.5 px-4
                       bg-gradient-to-r
                       from-yellow-300
                       via-yellow-400
                       to-amber-500
                       hover:from-yellow-400
                       hover:via-yellow-500
                       hover:to-amber-600
                       text-black font-semibold rounded-xl
                       shadow-lg shadow-yellow-500/30
                       hover:shadow-yellow-500/50
                       focus:outline-none
                       focus:ring-2 focus:ring-yellow-400
                       focus:ring-offset-2
                       focus:ring-offset-purple-900
                       transition-all transform
                       active:scale-[0.99]
                       flex items-center justify-center gap-2">

                <span id="btn-text">
                    Entrar
                </span>

                <i id="btn-icon"
                   class="fa-solid fa-arrow-right text-sm"></i>

                <div id="btn-spinner"
                     class="w-5 h-5 border-2
                            border-black/30 border-t-black
                            rounded-full animate-spin hidden">
                </div>

            </button>

        </form>


        <!-- Divisor -->
        <div class="relative my-6">

            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/10"></div>
            </div>

            <div class="relative flex justify-center text-xs uppercase">

                <span class="bg-purple-900/40 px-3 text-purple-300
                             backdrop-blur-md rounded-full">

                    Ou continue com

                </span>

            </div>

        </div>


        <!-- Login Social -->
        <div class="grid grid-cols-2 gap-3">

            <button
                onclick="socialLogin('Google')"
                type="button"
                class="flex items-center justify-center gap-2
                       py-2.5 px-4 bg-white/5 hover:bg-white/10
                       border border-white/10 rounded-xl text-sm
                       font-medium text-white transition-all
                       active:scale-[0.98]">

                <i class="fa-brands fa-google text-yellow-400"></i>

                <span>Google</span>

            </button>

            <button
                onclick="socialLogin('GitHub')"
                type="button"
                class="flex items-center justify-center gap-2
                       py-2.5 px-4 bg-white/5 hover:bg-white/10
                       border border-white/10 rounded-xl text-sm
                       font-medium text-white transition-all
                       active:scale-[0.98]">

                <i class="fa-brands fa-github text-indigo-300"></i>

                <span>GitHub</span>

            </button>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- DASHBOARD                                 -->
    <!-- ========================================= -->

    <div id="dashboard-container"
         class="hidden relative w-full max-w-xl
                bg-white/10 backdrop-blur-xl
                border border-white/20 rounded-3xl
                shadow-2xl p-6 sm:p-8 z-10">

        <div class="flex items-center justify-between
                    pb-6 border-b border-white/10">

            <div class="flex items-center gap-3">

                <div id="user-avatar"
                     class="w-12 h-12 rounded-full
                            bg-gradient-to-tr from-yellow-300 to-amber-500
                            flex items-center justify-center
                            font-bold text-lg text-black shadow-md">
                    US
                </div>

                <div>

                    <h2 id="dashboard-username"
                        class="text-lg font-bold text-white">
                        Usuário
                    </h2>

                    <p id="dashboard-email"
                       class="text-xs text-purple-200">
                        usuario@email.com
                    </p>

                </div>

            </div>

            <button
                onclick="logout()"
                class="px-4 py-2 bg-white/10 hover:bg-white/20
                       border border-white/15 rounded-xl text-xs
                       font-semibold text-white transition-all
                       flex items-center gap-2">

                <i class="fa-solid fa-arrow-right-from-bracket"></i>

                <span>Sair</span>

            </button>

        </div>


        <div class="py-6">

            <div class="bg-gradient-to-r
                        from-yellow-500/20 to-amber-600/20
                        border border-white/10 rounded-2xl p-5">

                <span class="inline-block px-2.5 py-1
                             bg-yellow-500/30 text-yellow-300
                             rounded-lg text-xs font-semibold mb-2">

                    Sessão ativa

                </span>

                <h3 class="text-xl font-bold text-white mb-1">
                    Bem-vindo ao seu painel!
                </h3>

                <p class="text-sm text-purple-200">
                    Você entrou com sucesso na plataforma.
                </p>

            </div>

        </div>

    </div>


    <!-- Toast -->
    <div id="toast-container"
         class="fixed bottom-6 right-6 z-50
                transform translate-y-20 opacity-0
                transition-all duration-300
                pointer-events-none">

        <div class="bg-slate-900/90 backdrop-blur-md
                    border border-white/20 text-white
                    px-5 py-3 rounded-2xl shadow-2xl
                    flex items-center gap-3">

            <i class="fa-solid fa-circle-check text-emerald-400"></i>

            <span id="toast-message"
                  class="text-sm font-medium">
                Notificação
            </span>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- JAVASCRIPT                                -->
    <!-- ========================================= -->

    <script>

        let currentMode = "login";


        // Trocar Login / Registro
        function switchTab(mode) {

            currentMode = mode;

            const indicator =
                document.getElementById("tab-indicator");

            const btnLogin =
                document.getElementById("btn-tab-login");

            const btnRegister =
                document.getElementById("btn-tab-register");

            const formTitle =
                document.getElementById("form-title");

            const formSubtitle =
                document.getElementById("form-subtitle");

            const btnText =
                document.getElementById("btn-text");

            const nameContainer =
                document.getElementById("name-field-container");

            const extraOptions =
                document.getElementById("extra-options");


            clearErrors();


            if (mode === "login") {

                indicator.style.transform = "translateX(0%)";

                btnLogin.className =
                    "relative z-10 py-2.5 text-sm font-semibold text-white";

                btnRegister.className =
                    "relative z-10 py-2.5 text-sm font-semibold text-purple-300 hover:text-white";

                formTitle.innerText =
                    "Bem Vindo ao Kiko";

                formSubtitle.innerText =
                    "Por favor, insira seus dados para entrar.";

                btnText.innerText =
                    "Entrar";

                nameContainer.classList.add(
                    "hidden",
                    "opacity-0"
                );

                extraOptions.classList.remove("hidden");

            } else {

                indicator.style.transform =
                    "translateX(100%)";

                btnRegister.className =
                    "relative z-10 py-2.5 text-sm font-semibold text-white";

                btnLogin.className =
                    "relative z-10 py-2.5 text-sm font-semibold text-purple-300 hover:text-white";

                formTitle.innerText =
                    "Criar Conta";

                formSubtitle.innerText =
                    "Crie sua conta na plataforma.";

                btnText.innerText =
                    "Criar Conta";

                nameContainer.classList.remove("hidden");

                setTimeout(function () {
                    nameContainer.classList.remove("opacity-0");
                }, 10);

                extraOptions.classList.add("hidden");
            }
        }


        // Mostrar / esconder senha
        function togglePasswordVisibility() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("toggle-icon");

            if (password.type === "password") {

                password.type = "text";

                icon.className =
                    "fa-regular fa-eye-slash";

            } else {

                password.type = "password";

                icon.className =
                    "fa-regular fa-eye";

            }
        }


        // Envio do formulário
        function handleSubmit(event) {

            event.preventDefault();

            clearErrors();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const fullname =
                document.getElementById("fullname").value.trim();

            let valid = true;


            if (!email) {

                showError(
                    "email",
                    "Digite seu e-mail."
                );

                valid = false;

            }


            if (!password) {

                showError(
                    "password",
                    "Digite sua senha."
                );

                valid = false;

            } else if (password.length < 6) {

                showError(
                    "password",
                    "A senha deve ter pelo menos 6 caracteres."
                );

                valid = false;

            }


            if (currentMode === "register" && !fullname) {

                showError(
                    "name",
                    "Digite seu nome completo."
                );

                valid = false;

            }


            if (!valid) return;


            setLoading(true);


            setTimeout(function () {

                setLoading(false);

                const name =
                    currentMode === "register"
                        ? fullname
                        : email.split("@")[0];

                showDashboard(name, email);

                showToast(
                    currentMode === "login"
                        ? "Login realizado com sucesso!"
                        : "Conta criada com sucesso!"
                );

            }, 1200);
        }


        // Mostrar erro
        function showError(field, message) {

            const error =
                document.getElementById(field + "-error");

            if (error) {

                error.innerText = message;

                error.classList.remove("hidden");

            }


            const input =
                document.getElementById(
                    field === "name"
                        ? "fullname"
                        : field
                );

            if (input) {

                input.classList.add(
                    "border-pink-500",
                    "ring-1",
                    "ring-pink-500"
                );

            }
        }


        // Limpar erros
        function clearErrors() {

            ["email", "password", "name"].forEach(function(field) {

                const error =
                    document.getElementById(
                        field + "-error"
                    );

                if (error) {
                    error.classList.add("hidden");
                }


                const input =
                    document.getElementById(
                        field === "name"
                            ? "fullname"
                            : field
                    );

                if (input) {

                    input.classList.remove(
                        "border-pink-500",
                        "ring-1",
                        "ring-pink-500"
                    );

                }

            });
        }


        // Loading do botão
        function setLoading(isLoading) {

            const btn =
                document.getElementById("submit-btn");

            const text =
                document.getElementById("btn-text");

            const icon =
                document.getElementById("btn-icon");

            const spinner =
                document.getElementById("btn-spinner");


            if (isLoading) {

                btn.disabled = true;

                text.classList.add("hidden");

                icon.classList.add("hidden");

                spinner.classList.remove("hidden");

            } else {

                btn.disabled = false;

                text.classList.remove("hidden");

                icon.classList.remove("hidden");

                spinner.classList.add("hidden");

            }
        }


        // Dashboard
        function showDashboard(name, email) {

            const auth =
                document.getElementById("auth-container");

            const dashboard =
                document.getElementById("dashboard-container");


            auth.classList.add(
                "opacity-0",
                "scale-95",
                "pointer-events-none"
            );


            setTimeout(function() {

                auth.classList.add("hidden");

                dashboard.classList.remove("hidden");

                document.getElementById(
                    "dashboard-username"
                ).innerText = name;

                document.getElementById(
                    "dashboard-email"
                ).innerText = email;


                const initials =
                    name
                        .split(" ")
                        .map(n => n[0])
                        .join("")
                        .substring(0, 2)
                        .toUpperCase();


                document.getElementById(
                    "user-avatar"
                ).innerText = initials;

            }, 300);
        }


        // Logout
        function logout() {

            const auth =
                document.getElementById("auth-container");

            const dashboard =
                document.getElementById("dashboard-container");


            dashboard.classList.add(
                "opacity-0",
                "scale-95"
            );


            setTimeout(function() {

                dashboard.classList.add("hidden");

                auth.classList.remove(
                    "hidden",
                    "opacity-0",
                    "scale-95",
                    "pointer-events-none"
                );

                document.getElementById(
                    "auth-form"
                ).reset();

                switchTab("login");

            }, 300);


            showToast("Você saiu da conta.");
        }


        // Login social
        function socialLogin(provider) {

            setLoading(true);

            setTimeout(function() {

                setLoading(false);

                showDashboard(
                    provider + " User",
                    "user@" + provider.toLowerCase() + ".com"
                );

                showToast(
                    "Conectado com " + provider + "!"
                );

            }, 1000);
        }


        // Esqueci senha
        function showForgotPassword(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            if (!email) {

                showError(
                    "email",
                    "Digite seu e-mail primeiro."
                );

                return;
            }

            showToast(
                "Link de recuperação enviado para " + email
            );
        }


        // Toast
        function showToast(message) {

            const container =
                document.getElementById(
                    "toast-container"
                );

            const msg =
                document.getElementById(
                    "toast-message"
                );


            msg.innerText = message;


            container.classList.remove(
                "translate-y-20",
                "opacity-0",
                "pointer-events-none"
            );


            setTimeout(function() {

                container.classList.add(
                    "translate-y-20",
                    "opacity-0",
                    "pointer-events-none"
                );

            }, 3500);
        }

    </script>

</body>
</html>
