<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem-vindo ao KAS</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">
  <main class="auth-layout">
    <section class="intro">
      <small>KAS / CREATOR NETWORK</small>

      <h1>Seu tempo tem valor.</h1>

      <p>
        Entre em uma rede viva para descobrir criadores,
        apoiar ideias e transformar presença em comunidade.
      </p>
    </section>

    <section class="auth-card">
      <div class="logo">⚡</div>

      <h2>Bem-vindo ao KAS</h2>

      <p class="subtitle" id="subtitle">
        Crie seu acesso para continuar.
      </p>

      <div class="tabs">
        <button id="registerTab" class="active">
          Cadastrar
        </button>

        <button id="loginTab">
          Entrar
        </button>
      </div>

      <form id="authForm">
        <label id="nameWrap">
          Nome completo

          <input
            id="name"
            minlength="2"
            autocomplete="name"
            placeholder="Seu nome"
          >
        </label>

        <label>
          E-mail

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="voce@exemplo.com"
          >
        </label>

        <label>
          Senha

          <input
            id="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Mínimo de 8 caracteres"
          >
        </label>

        <p id="message" class="message"></p>

        <button id="submit" class="primary" type="submit">
          Criar minha conta →
        </button>
      </form>

      <p class="foot">
        Sua senha é protegida pelo Supabase. O acesso só é liberado
        após a confirmação do e-mail.
      </p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
